services:

    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile

        container_name: laravel_app

        restart: unless-stopped

        working_dir: /var/www

        volumes:
            - ./:/var/www

        depends_on:
            - mariadb

        networks:
            - laravel

    nginx:

        image: nginx:latest

        container_name: laravel_nginx

        restart: unless-stopped

        ports:
            - "8000:80"

        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

        depends_on:
            - app

        networks:
            - laravel

    mariadb:

        image: mariadb:11

        container_name: laravel_db

        restart: unless-stopped

        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret

        ports:
            - "3306:3306"

        volumes:
            - db_data:/var/lib/mysql

        networks:
            - laravel

    node:

        build:
            context: .
            dockerfile: docker/php/Dockerfile

        container_name: laravel_node

        working_dir: /var/www

        volumes:
            - ./:/var/www

        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

        ports:
            - "5173:5173"

        networks:
            - laravel

volumes:

    db_data:

networks:

    laravel:
